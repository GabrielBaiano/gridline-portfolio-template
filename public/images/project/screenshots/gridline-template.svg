<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <pattern id="small-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#3f3f46"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#0f0f11"/>
  <rect x="60" y="40" width="680" height="120" fill="url(#small-dots)" opacity="0.7"/>
  <rect x="60" y="40" width="680" height="520" fill="none" stroke="#3f3f46" stroke-width="2" stroke-dasharray="6 6" rx="12"/>
  <line x1="60" y1="160" x2="740" y2="160" stroke="#3f3f46" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="120" cy="160" r="36" fill="#27272a" stroke="#52525b" stroke-width="2"/>
  <rect x="180" y="190" width="240" height="22" rx="4" fill="#e4e4e7"/>
  <rect x="180" y="225" width="360" height="14" rx="3" fill="#71717a"/>
  <line x1="60" y1="270" x2="740" y2="270" stroke="#3f3f46" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- Grid Heatmap preview -->
  <g transform="translate(90, 310)">
    <text x="0" y="-12" fill="#a1a1aa" font-family="sans-serif" font-size="14" font-weight="600">Contribution Graph</text>
  </g>
</svg>