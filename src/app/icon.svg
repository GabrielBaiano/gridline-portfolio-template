<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- White circular background -->
  <circle cx="16" cy="16" r="15" fill="#ffffff" />
  
  <!-- Modern 8-arm asterisk in the center -->
  <g stroke="#000000" stroke-width="2.5" stroke-linecap="round">
    <!-- Vertical -->
    <line x1="16" y1="8.5" x2="16" y2="23.5" />
    <!-- Horizontal -->
    <line x1="8.5" y1="16" x2="23.5" y2="16" />
    <!-- Diagonal 1 -->
    <line x1="10.7" y1="10.7" x2="21.3" y2="21.3" />
    <!-- Diagonal 2 -->
    <line x1="10.7" y1="21.3" x2="21.3" y2="10.7" />
  </g>
</svg>
